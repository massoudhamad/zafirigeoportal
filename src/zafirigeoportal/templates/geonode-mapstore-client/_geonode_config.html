{% extends 'geonode-mapstore-client/_geonode_config.html' %}
{% load static %}

{% block override_local_config %}
<script>
    window.__GEONODE_CONFIG__.overrideLocalConfig = function(localConfig, _) {
        // ZAFIRI Marine Atlas Configuration
        if (localConfig.map) {
            localConfig.map.center = { x: 39.3, y: -5.9, crs: "EPSG:4326" };
            localConfig.map.zoom = 9;
        }
        localConfig.theme = {
            ...(localConfig.theme || {}),
            primaryColor: '#1a5f7a',
            primaryContrastColor: '#ffffff',
            infoColor: '#17a2b8',
            successColor: '#27ae60',
            warningColor: '#f39c12',
            dangerColor: '#e74c3c'
        };
        return localConfig;
    };
</script>
{% endblock %}

{% block extra_style %}
<style>
/* ===========================================
   HIDE GEONODE DEFAULT NAVBAR
   =========================================== */
.gn-brand-navbar,
nav.gn-menu,
.gn-main-header,
#gn-topbar,
.gn-main-header-wrapper,
header.gn-main-header,
.gn-menu-content,
.gn-brand-navbar-container {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
    overflow: hidden !important;
    opacity: 0 !important;
}

/* ===========================================
   BODY AND LAYOUT ADJUSTMENTS
   =========================================== */
html, body {
    padding-top: 64px !important;
    margin-top: 0 !important;
}

#gn-app {
    min-height: calc(100vh - 64px) !important;
}

/* ===========================================
   ZAFIRI NAVBAR STYLES
   =========================================== */
#zafiri-navbar {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    height: 64px !important;
    background: linear-gradient(135deg, #0d3d4d 0%, #1a5f7a 100%) !important;
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    justify-content: space-between !important;
    padding: 0 20px !important;
    z-index: 999999 !important;
    box-shadow: 0 2px 20px rgba(0, 0, 0, 0.2) !important;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
}

#zafiri-navbar * {
    box-sizing: border-box !important;
    font-family: inherit !important;
}

/* Brand */
.zn-brand {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 12px !important;
    text-decoration: none !important;
    flex-shrink: 0 !important;
}

.zn-logo {
    width: 44px !important;
    height: 44px !important;
    background: #fff !important;
    border-radius: 50% !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    overflow: hidden !important;
}

.zn-logo img {
    width: 40px !important;
    height: 40px !important;
    object-fit: contain !important;
}

.zn-title {
    display: flex !important;
    flex-direction: column !important;
}

.zn-title-main {
    font-size: 20px !important;
    font-weight: 700 !important;
    color: #fff !important;
    letter-spacing: 1px !important;
    line-height: 1.2 !important;
}

.zn-title-sub {
    font-size: 11px !important;
    color: rgba(255,255,255,0.7) !important;
    letter-spacing: 2px !important;
    text-transform: uppercase !important;
}

/* Navigation */
.zn-nav {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 4px !important;
    list-style: none !important;
    margin: 0 !important;
    padding: 0 !important;
}

.zn-nav li {
    list-style: none !important;
    margin: 0 !important;
    padding: 0 !important;
}

.zn-nav a {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 10px 16px !important;
    color: rgba(255,255,255,0.85) !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    text-decoration: none !important;
    border-radius: 6px !important;
    transition: all 0.2s ease !important;
}

.zn-nav a:hover {
    color: #fff !important;
    background: rgba(255,255,255,0.15) !important;
    text-decoration: none !important;
}

.zn-nav a i {
    font-size: 16px !important;
}

/* Search */
.zn-search {
    flex: 1 !important;
    max-width: 300px !important;
    margin: 0 20px !important;
    position: relative !important;
}

.zn-search input {
    width: 100% !important;
    height: 38px !important;
    padding: 0 16px 0 40px !important;
    border: none !important;
    border-radius: 19px !important;
    background: rgba(255,255,255,0.15) !important;
    color: #fff !important;
    font-size: 14px !important;
    outline: none !important;
}

.zn-search input::placeholder {
    color: rgba(255,255,255,0.6) !important;
}

.zn-search input:focus {
    background: rgba(255,255,255,0.25) !important;
}

.zn-search i {
    position: absolute !important;
    left: 14px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
    color: rgba(255,255,255,0.6) !important;
    font-size: 14px !important;
}

/* Actions */
.zn-actions {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 12px !important;
}

.zn-btn-register {
    padding: 8px 18px !important;
    background: transparent !important;
    color: #fff !important;
    border: 1px solid rgba(255,255,255,0.5) !important;
    border-radius: 20px !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    text-decoration: none !important;
    transition: all 0.2s ease !important;
}

.zn-btn-register:hover {
    background: rgba(255,255,255,0.1) !important;
    border-color: #fff !important;
    color: #fff !important;
    text-decoration: none !important;
}

.zn-btn-login {
    padding: 8px 18px !important;
    background: #17a2b8 !important;
    color: #fff !important;
    border: none !important;
    border-radius: 20px !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    text-decoration: none !important;
    transition: all 0.2s ease !important;
}

.zn-btn-login:hover {
    background: #fff !important;
    color: #0d3d4d !important;
    text-decoration: none !important;
}

/* Dropdown menus */
.zn-dropdown {
    position: relative !important;
}

.zn-dropdown-btn {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 8px !important;
    padding: 6px 14px !important;
    background: rgba(255,255,255,0.1) !important;
    border: none !important;
    border-radius: 20px !important;
    color: #fff !important;
    font-size: 14px !important;
    cursor: pointer !important;
    transition: all 0.2s ease !important;
}

.zn-dropdown-btn:hover {
    background: rgba(255,255,255,0.2) !important;
}

.zn-dropdown-btn.admin {
    background: rgba(23,162,184,0.3) !important;
}

.zn-dropdown-menu {
    position: absolute !important;
    top: 100% !important;
    right: 0 !important;
    margin-top: 8px !important;
    background: #0d3d4d !important;
    border-radius: 10px !important;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3) !important;
    min-width: 200px !important;
    padding: 8px !important;
    display: none !important;
    z-index: 1000000 !important;
}

.zn-dropdown:hover .zn-dropdown-menu {
    display: block !important;
}

.zn-dropdown-menu a {
    display: flex !important;
    flex-direction: row !important;
    align-items: center !important;
    gap: 10px !important;
    padding: 10px 14px !important;
    color: rgba(255,255,255,0.85) !important;
    text-decoration: none !important;
    border-radius: 6px !important;
    font-size: 14px !important;
}

.zn-dropdown-menu a:hover {
    background: rgba(23,162,184,0.3) !important;
    color: #fff !important;
}

.zn-dropdown-menu a i {
    width: 18px !important;
    text-align: center !important;
    color: #17a2b8 !important;
}

.zn-divider {
    height: 1px !important;
    background: rgba(255,255,255,0.1) !important;
    margin: 6px 0 !important;
}

/* Language toggle */
.zn-lang {
    display: flex !important;
    align-items: center !important;
    gap: 6px !important;
    padding: 6px 12px !important;
    background: rgba(255,255,255,0.1) !important;
    border-radius: 20px !important;
}

.zn-lang span {
    font-size: 12px !important;
    font-weight: 600 !important;
    color: rgba(255,255,255,0.6) !important;
    cursor: pointer !important;
}

.zn-lang span:hover,
.zn-lang span.active {
    color: #fff !important;
}

.zn-lang-sep {
    color: rgba(255,255,255,0.3) !important;
    cursor: default !important;
}

/* Responsive */
@media (max-width: 1100px) {
    .zn-search { max-width: 200px !important; }
}

@media (max-width: 900px) {
    .zn-search { display: none !important; }
    .zn-nav a span { display: none !important; }
    .zn-nav a { padding: 10px 12px !important; }
}

@media (max-width: 700px) {
    .zn-btn-register { display: none !important; }
    .zn-title-sub { display: none !important; }
    .zn-dropdown-btn span { display: none !important; }
}
</style>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    // ZAFIRI Navbar injection
    var NAVBAR_ID = 'zafiri-navbar';

    function getStaticUrl(path) {
        return '{% static "" %}' + path;
    }

    function createNavbar() {
        // Already exists?
        if (document.getElementById(NAVBAR_ID)) {
            return;
        }

        // Get user info from GeoNode config
        var config = window.__GEONODE_CONFIG__ || {};
        var user = config.user || {};
        var isAuth = user && user.pk;
        var username = isAuth ? (user.username || 'User') : null;
        var isAdmin = isAuth && (user.is_superuser || user.is_staff);

        // Build navbar HTML
        var html = '<a href="/" class="zn-brand">' +
            '<div class="zn-logo"><img src="' + getStaticUrl('img/zafiri_logo.svg') + '" alt="ZAFIRI"></div>' +
            '<div class="zn-title"><span class="zn-title-main">ZAFIRI</span><span class="zn-title-sub">Marine Atlas</span></div>' +
            '</a>' +
            '<ul class="zn-nav">' +
            '<li><a href="/"><i class="fa fa-home"></i><span>Home</span></a></li>' +
            '<li><a href="/catalogue/#/search/?f=dataset"><i class="fa fa-database"></i><span>Data</span></a></li>' +
            '<li><a href="/catalogue/#/search/?f=map"><i class="fa fa-map"></i><span>Maps</span></a></li>' +
            '<li><a href="/catalogue/#/search/?f=document"><i class="fa fa-file-alt"></i><span>Docs</span></a></li>' +
            '<li><a href="/about/"><i class="fa fa-info-circle"></i><span>About</span></a></li>' +
            '</ul>' +
            '<div class="zn-search"><i class="fa fa-search"></i><input type="text" placeholder="Search datasets, maps..." id="zn-search-input"></div>' +
            '<div class="zn-actions">';

        // Admin dropdown
        if (isAdmin) {
            html += '<div class="zn-dropdown">' +
                '<button class="zn-dropdown-btn admin"><i class="fa fa-cogs"></i><span>Admin</span><i class="fa fa-angle-down"></i></button>' +
                '<div class="zn-dropdown-menu">' +
                '<a href="/admin/"><i class="fa fa-tachometer-alt"></i>Admin Panel</a>' +
                '<a href="/geoserver/"><i class="fa fa-server"></i>GeoServer</a>' +
                '<a href="/monitoring/"><i class="fa fa-chart-line"></i>Monitoring</a>' +
                '<div class="zn-divider"></div>' +
                '<a href="/people/"><i class="fa fa-users"></i>Users</a>' +
                '<a href="/groups/"><i class="fa fa-user-friends"></i>Groups</a>' +
                '</div></div>';
        }

        // User menu or auth buttons
        if (isAuth) {
            html += '<div class="zn-dropdown">' +
                '<button class="zn-dropdown-btn"><i class="fa fa-user-circle"></i><span>' + username + '</span><i class="fa fa-angle-down"></i></button>' +
                '<div class="zn-dropdown-menu">' +
                '<a href="/people/profile/' + username + '/"><i class="fa fa-user"></i>Profile</a>' +
                '<a href="/catalogue/#/search/?owner=' + username + '"><i class="fa fa-folder"></i>My Resources</a>' +
                '<a href="/messages/inbox/"><i class="fa fa-inbox"></i>Inbox</a>' +
                '<div class="zn-divider"></div>' +
                '<a href="/account/logout/"><i class="fa fa-sign-out-alt"></i>Logout</a>' +
                '</div></div>';
        } else {
            html += '<a href="/account/signup/" class="zn-btn-register">Register</a>' +
                '<a href="/account/login/" class="zn-btn-login">Login</a>';
        }

        // Language toggle
        html += '<div class="zn-lang">' +
            '<span class="active" data-lang="en">EN</span>' +
            '<span class="zn-lang-sep">/</span>' +
            '<span data-lang="sw">SW</span>' +
            '</div></div>';

        // Create element
        var navbar = document.createElement('nav');
        navbar.id = NAVBAR_ID;
        navbar.innerHTML = html;

        // Insert at very beginning of body
        if (document.body.firstChild) {
            document.body.insertBefore(navbar, document.body.firstChild);
        } else {
            document.body.appendChild(navbar);
        }

        // Setup search
        var searchInput = document.getElementById('zn-search-input');
        if (searchInput) {
            searchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && this.value.trim()) {
                    window.location.href = '/catalogue/#/search/?q=' + encodeURIComponent(this.value.trim());
                }
            });
        }

        // Setup language toggle
        navbar.querySelectorAll('.zn-lang span[data-lang]').forEach(function(opt) {
            opt.addEventListener('click', function() {
                if (this.classList.contains('zn-lang-sep')) return;
                document.cookie = 'django_language=' + this.dataset.lang + ';path=/';
                window.location.reload();
            });
        });

        console.log('ZAFIRI navbar created');
    }

    // Try immediately
    createNavbar();

    // Try on DOMContentLoaded
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', createNavbar);
    }

    // Try after delays (React may take time to render)
    setTimeout(createNavbar, 100);
    setTimeout(createNavbar, 300);
    setTimeout(createNavbar, 600);
    setTimeout(createNavbar, 1000);
    setTimeout(createNavbar, 2000);

    // MutationObserver to ensure navbar stays
    var observer = new MutationObserver(function(mutations) {
        if (!document.getElementById(NAVBAR_ID)) {
            createNavbar();
        }
    });

    function startObserver() {
        if (document.body) {
            observer.observe(document.body, { childList: true, subtree: false });
        } else {
            setTimeout(startObserver, 50);
        }
    }
    startObserver();
})();
</script>
{% endblock %}
