{% extends 'geonode-mapstore-client/_geonode_config.html' %}
{% load static %}

{% block override_local_config %}
<script>
    window.__GEONODE_CONFIG__.overrideLocalConfig = function(localConfig, _) {
        // ZAFIRI Marine Atlas Configuration - Zanzibar centered
        if (localConfig.map) {
            localConfig.map.center = { x: 39.3, y: -5.9, crs: "EPSG:4326" };
            localConfig.map.zoom = 9;
        }

        // ZAFIRI Theme Colors
        localConfig.theme = {
            ...(localConfig.theme || {}),
            primaryColor: '#1a5f7a',
            primaryContrastColor: '#ffffff',
            infoColor: '#17a2b8',
            successColor: '#27ae60',
            warningColor: '#f39c12',
            dangerColor: '#e74c3c'
        };

        return localConfig;
    };
</script>
{% endblock %}

{% block extra_style %}
<style>
/* ============================================
   ZAFIRI MapStore Theme - Clean Override
   ============================================ */

/* Apply ZAFIRI color theme to GeoNode navbar */
.gn-brand-navbar,
.gn-main-header {
    background: linear-gradient(135deg, #0d3d4d 0%, #1a5f7a 100%) !important;
}

/* Menu items */
.gn-menu .nav-link,
.gn-menu a {
    color: rgba(255, 255, 255, 0.85) !important;
}

.gn-menu .nav-link:hover,
.gn-menu a:hover {
    color: #ffffff !important;
    background: rgba(255, 255, 255, 0.1) !important;
}

/* Primary buttons */
.gn-brand-navbar .btn-primary,
.gn-main-header .btn-primary {
    background: #17a2b8 !important;
    border-color: #17a2b8 !important;
}

.gn-brand-navbar .btn-primary:hover,
.gn-main-header .btn-primary:hover {
    background: #138496 !important;
}

/* Dropdown menus */
.gn-menu .dropdown-menu {
    background: #0d3d4d !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
}

.gn-menu .dropdown-menu a,
.gn-menu .dropdown-item {
    color: rgba(255, 255, 255, 0.85) !important;
}

.gn-menu .dropdown-menu a:hover,
.gn-menu .dropdown-item:hover {
    background: rgba(23, 162, 184, 0.3) !important;
    color: #ffffff !important;
}

/* Search bar */
.gn-search-bar input,
.gn-main-header input[type="text"] {
    background: rgba(255, 255, 255, 0.15) !important;
    border: none !important;
    color: #ffffff !important;
}

.gn-search-bar input::placeholder {
    color: rgba(255, 255, 255, 0.6) !important;
}

/* Hero section styling */
.gn-hero-section {
    background: linear-gradient(135deg, #0d3d4d 0%, #1a5f7a 100%) !important;
}

/* Cards and panels */
.gn-card,
.ms-panel {
    border-radius: 12px !important;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08) !important;
}

/* Action buttons */
.btn-primary {
    background: #17a2b8 !important;
    border-color: #17a2b8 !important;
}

.btn-primary:hover {
    background: #138496 !important;
    border-color: #138496 !important;
}

/* Links */
a {
    color: #1a5f7a;
}

a:hover {
    color: #0d3d4d;
}

/* Footer */
.gn-footer {
    background: linear-gradient(135deg, #0d3d4d 0%, #1a5f7a 100%) !important;
}

/* Catalogue filters sidebar */
.gn-filters-panel {
    background: #f8f9fa !important;
}

/* Resource cards */
.gn-resource-card {
    border-radius: 10px !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease !important;
}

.gn-resource-card:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12) !important;
}

/* Tabs */
.nav-tabs .nav-link.active {
    border-bottom-color: #17a2b8 !important;
    color: #1a5f7a !important;
}

/* Forms */
.form-control:focus {
    border-color: #17a2b8 !important;
    box-shadow: 0 0 0 3px rgba(23, 162, 184, 0.15) !important;
}

/* Badges */
.badge-primary {
    background: #17a2b8 !important;
}

/* Loading spinner color */
.gn-loader,
.spinner-border {
    color: #17a2b8 !important;
}
</style>
{% endblock %}

{% block extra_script %}
<script>
(function() {
    'use strict';

    // Add ZAFIRI branding class to body for CSS targeting
    document.body.classList.add('zafiri-theme');

    // Log for debugging
    console.log('ZAFIRI theme applied to MapStore');
})();
</script>
{% endblock %}
