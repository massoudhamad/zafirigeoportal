<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="oceanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f7a"/>
      <stop offset="100%" style="stop-color:#0d3d4d"/>
    </linearGradient>
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#17a2b8"/>
      <stop offset="100%" style="stop-color:#1a5f7a"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#oceanGradient)" stroke="#0d3d4d" stroke-width="2"/>

  <!-- Ocean waves -->
  <path d="M10 55 Q25 45, 40 55 T70 55 T100 55" fill="none" stroke="url(#waveGradient)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M5 65 Q20 55, 35 65 T65 65 T95 65" fill="none" stroke="url(#waveGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M8 75 Q23 65, 38 75 T68 75 T98 75" fill="none" stroke="url(#waveGradient)" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Fish silhouette -->
  <g transform="translate(25, 28) scale(0.5)">
    <path d="M80 40 C95 30 95 50 80 40 M10 40 Q30 15 60 25 Q80 30 80 40 Q80 50 60 55 Q30 65 10 40 Z"
          fill="#ffffff" opacity="0.95"/>
    <circle cx="25" cy="38" r="4" fill="#0d3d4d"/>
    <path d="M45 35 Q55 40 45 45" fill="none" stroke="#1a5f7a" stroke-width="2" opacity="0.6"/>
    <path d="M50 33 Q60 40 50 47" fill="none" stroke="#1a5f7a" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ZAFIRI text arc (optional - can be removed) -->
  <text x="50" y="92" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="8" font-weight="bold" letter-spacing="1">
    ZAFIRI
  </text>
</svg>
